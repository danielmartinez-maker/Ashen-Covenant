name: Apply V7 Equipment Presentation Ownership

on:
  push:
    branches:
      - v7-embodied-covenant

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7-embodied-covenant
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-v7-equipment-presentation-ownership.mjs
      - name: Commit presentation ownership
        shell: bash
        run: |
          if git diff --quiet -- src/presentation/system.js; then
            echo "No presentation ownership changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/presentation/system.js
          git commit -m "feat: resolve live v7 equipment appearance"
          git push origin HEAD:v7-embodied-covenant
