name: Generate V7 Equipment Assets

on:
  push:
    branches:
      - v7-embodied-covenant

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7-embodied-covenant
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate twice and verify determinism
        shell: bash
        run: |
          node scripts/generate-equipment-v7-assets.mjs
          sha256sum public/assets/equipment/v7/equipment-layers-v7.svg public/assets/equipment/v7/equipment-signatures-v7.svg > /tmp/equipment-before.sha
          node scripts/generate-equipment-v7-assets.mjs
          sha256sum public/assets/equipment/v7/equipment-layers-v7.svg public/assets/equipment/v7/equipment-signatures-v7.svg > /tmp/equipment-after.sha
          diff -u /tmp/equipment-before.sha /tmp/equipment-after.sha
      - name: Commit generated atlases
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- public/assets/equipment/v7)" ]; then
            echo "No generated asset changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/equipment/v7/equipment-layers-v7.svg public/assets/equipment/v7/equipment-signatures-v7.svg
          git commit -m "feat: generate v7 equipment atlases"
          git push origin HEAD:v7-embodied-covenant
