name: V7 Bug Sweep

on:
  push:
    branches:
      - v7-embodied-covenant

concurrency:
  group: v7-bug-sweep
  cancel-in-progress: true

jobs:
  full-tests-node22:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:v6

  build-and-file-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:file-protocol

  windows-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run desktop:win
      - run: npm run desktop:win:portable

  static-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Syntax check runtime and scripts
        shell: bash
        run: |
          find src scripts desktop -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Runtime asset reference audit
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const files = [];
          const walk = (entry) => {
            const stat = fs.statSync(entry);
            if (stat.isDirectory()) for (const name of fs.readdirSync(entry)) walk(path.join(entry, name));
            else if (/\.(?:js|css|html)$/.test(entry)) files.push(entry);
          };
          walk('src');
          files.push('index.html');
          const refs = new Set();
          const pattern = /\/assets\/[A-Za-z0-9_./-]+\.(?:png|svg|jpg|jpeg|webp|wav|mp3|ogg|ico)/g;
          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            for (const match of text.matchAll(pattern)) refs.add(match[0]);
          }
          const missing = [...refs].filter((ref) => !fs.existsSync(path.join('public', ref)));
          console.log(`audited ${refs.size} static runtime asset references`);
          if (missing.length) {
            console.error('Missing runtime assets:');
            for (const ref of missing) console.error(`  ${ref}`);
            process.exit(1);
          }
          NODE
      - name: Retired runtime contract audit
        shell: bash
        run: |
          if grep -R -n -E 'player\.equipmentPresentation|hero-facing-atlas-v5\.png' src; then
            echo 'Found retired runtime presentation references.' >&2
            exit 1
          fi
      - name: Report TODO and FIXME markers
        shell: bash
        run: |
          grep -R -n -E 'TODO|FIXME|HACK|XXX' src desktop || true

  class-matrix-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Exercise every valid ordered class pair
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { CLASS_IDS, getHybrid } from './src/data/classes.js';
          import { GameEngine } from './src/systems/game.js';

          const makeStore = () => {
            const store = new Map();
            globalThis.localStorage = {
              getItem: (key) => store.get(key) ?? null,
              setItem: (key, value) => store.set(key, String(value)),
              removeItem: (key) => store.delete(key)
            };
            return store;
          };
          const makeInput = () => ({
            pointer: { active: false, worldX: 0, worldY: 0 },
            tick() {}, updateWorldPointer() {}, getMove() { return { x: 0, y: 0, moving: false }; },
            getAimDirection() { return null; }, isHeld() { return false; }, consume() { return false; },
            defer() {}, press() {}, rumble() {}
          });
          const renderer = { viewport: { width: 1280, height: 720, scale: 1 }, getAssetStatus: () => ({ ready: true, failed: [] }) };
          const finiteActor = (actor, label) => {
            for (const key of ['x', 'y', 'hp', 'maxHp']) if (key in actor) assert.ok(Number.isFinite(Number(actor[key])), `${label}.${key} must be finite`);
          };

          let pairs = 0;
          for (const primary of CLASS_IDS) {
            for (const secondary of CLASS_IDS) {
              if (primary === secondary || !getHybrid(primary, secondary)) continue;
              pairs += 1;
              makeStore();
              const game = new GameEngine(makeInput(), renderer, { reducedVfx: true, sound: false });
              assert.equal(game.start(primary, secondary), true, `${primary}+${secondary} must start`);
              for (let frame = 0; frame < 120; frame += 1) game.update(1 / 60);
              finiteActor(game.player, `${primary}+${secondary}:player`);
              for (const enemy of game.entities.enemies) finiteActor(enemy, `${primary}+${secondary}:enemy`);
              game.save();
              const restored = new GameEngine(makeInput(), renderer, { reducedVfx: true, sound: false });
              assert.equal(restored.continueRun(), true, `${primary}+${secondary} must restore`);
              assert.equal(restored.player.primary, primary);
              assert.equal(restored.player.secondary, secondary);
              finiteActor(restored.player, `${primary}+${secondary}:restored`);
            }
          }
          assert.ok(pairs >= 15, `expected at least 15 valid class pairs, got ${pairs}`);
          console.log(`class matrix smoke passed for ${pairs} ordered pairs`);
          NODE

  node20-engine-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - name: Enforce dependency engine declarations
        env:
          npm_config_engine_strict: true
        run: npm ci

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
