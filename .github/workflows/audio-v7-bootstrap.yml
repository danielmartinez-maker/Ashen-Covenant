name: Bootstrap V7 Audio Bank

on:
  push:
    branches:
      - v7-embodied-covenant

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'danielmartinez-maker/Ashen-Covenant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7-embodied-covenant
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Generate deterministic v7 WAV bank
        run: node scripts/generate-audio-v7.mjs
      - name: Validate registry and WAV headers
        run: node scripts/v7-audio-registry.mjs
      - name: Verify deterministic regeneration
        shell: bash
        run: |
          find public/assets/audio/v7 -type f -name '*.wav' -print0 | sort -z | xargs -0 sha256sum > /tmp/audio-v7-before.sha
          node scripts/generate-audio-v7.mjs
          sha256sum -c /tmp/audio-v7-before.sha
      - name: Commit generated bank when absent or changed
        shell: bash
        run: |
          git add public/assets/audio/v7
          if git diff --cached --quiet; then
            echo 'V7 audio bank already deterministic and current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add deterministic v7 combat audio bank'
          git push origin HEAD:v7-embodied-covenant
