name: Apply V7 Equipment Renderer

on:
  push:
    branches:
      - v7-embodied-covenant

permissions:
  contents: write

concurrency:
  group: apply-v7-equipment-renderer
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7-embodied-covenant
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-v7-equipment-renderer.mjs
      - name: Verify renderer cutover
        run: |
          node scripts/v7-equipment-renderer.mjs
          node scripts/loot-presentation-renderer.mjs
          node scripts/v7-animation-contract.mjs
          node scripts/visual-affix-ux.mjs
      - name: Commit renderer cutover
        shell: bash
        run: |
          if git diff --quiet -- src/systems/renderer.js scripts/loot-presentation-renderer.mjs; then
            echo "No renderer changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/systems/renderer.js scripts/loot-presentation-renderer.mjs
          git commit -m "feat: render v7 equipment appearance layers"
          git push origin HEAD:v7-embodied-covenant
