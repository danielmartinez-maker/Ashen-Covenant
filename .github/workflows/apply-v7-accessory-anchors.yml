name: Apply V7 Accessory Anchors

on:
  push:
    branches:
      - v7-embodied-covenant

permissions:
  contents: write

concurrency:
  group: apply-v7-accessory-anchors
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7-embodied-covenant
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: node scripts/apply-v7-accessory-anchors.mjs
      - run: node scripts/v7-equipment-renderer.mjs
      - name: Commit accessory anchor fix
        shell: bash
        run: |
          if git diff --quiet -- src/systems/renderer.js; then
            echo "No renderer anchor changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/systems/renderer.js
          git commit -m "fix: anchor accessory signatures in v7 renderer"
          git push origin HEAD:v7-embodied-covenant
