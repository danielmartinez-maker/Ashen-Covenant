name: Apply Dependency Audit Fix

on:
  push:
    branches:
      - v7-embodied-covenant

permissions:
  contents: write

concurrency:
  group: apply-dependency-audit-fix
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      npm_config_engine_strict: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7-embodied-covenant
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm audit fix --package-lock-only
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Commit lockfile remediation
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile remediation required."
            exit 0
          fi
          if ! git diff --quiet -- package.json; then
            echo "Refusing remediation: package.json changed." >&2
            git diff -- package.json
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: refresh vulnerable transitive dependencies"
          git push origin HEAD:v7-embodied-covenant
