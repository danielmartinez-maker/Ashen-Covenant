name: Bridge Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-drive-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download bridge test file anonymously
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            'https://drive.google.com/uc?export=download&id=1Q_ilrgjxQ711psRDTWtoCYX5hrodQb3I' \
            -o /tmp/bridge.md
          echo '8a505846573de9f1628eece0851387f722697338406680c4ac4b20e1fcb4f198  /tmp/bridge.md' | sha256sum -c -
