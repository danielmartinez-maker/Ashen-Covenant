name: V7 Combat Soundscape

on:
  push:
    branches:
      - v7-embodied-covenant
  pull_request:
    branches:
      - main

concurrency:
  group: v7-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_engine_strict: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: V7 semantic audio registry
        run: node scripts/v7-audio-registry.mjs
      - name: V7 semantic audio resolver
        run: node scripts/v7-audio-resolver.mjs
