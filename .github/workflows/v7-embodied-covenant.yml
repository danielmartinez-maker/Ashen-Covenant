name: V7 Embodied Covenant

on:
  push:
    branches:
      - v7-embodied-covenant
  pull_request:
    branches:
      - main

concurrency:
  group: v7-embodied-covenant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: V7 context regression
        shell: bash
        run: |
          if [ -f scripts/v7-combat-context.mjs ]; then
            node scripts/v7-combat-context.mjs
          fi
      - name: V7 animation regression
        shell: bash
        run: |
          if [ -f scripts/v7-animation-contract.mjs ]; then
            node scripts/v7-animation-contract.mjs
          fi
      - name: V7 animation assets regression
        shell: bash
        run: |
          if [ -f scripts/v7-animation-assets.mjs ]; then
            node scripts/v7-animation-assets.mjs
          fi
      - name: V7 animation integration regression
        shell: bash
        run: |
          if [ -f scripts/v7-animation-integration.mjs ]; then
            node scripts/v7-animation-integration.mjs
          fi
      - name: V7 equipment manifest regression
        shell: bash
        run: |
          if [ -f scripts/v7-equipment-manifest.mjs ]; then
            node scripts/v7-equipment-manifest.mjs
          fi
      - name: V7 equipment resolver regression
        shell: bash
        run: |
          if [ -f scripts/v7-equipment-resolver.mjs ]; then
            node scripts/v7-equipment-resolver.mjs
          fi
      - name: V7 equipment renderer regression
        shell: bash
        run: |
          if [ -f scripts/v7-equipment-renderer.mjs ]; then
            node scripts/v7-equipment-renderer.mjs
          fi
      - name: V6 regression gate
        run: npm run test:v6
