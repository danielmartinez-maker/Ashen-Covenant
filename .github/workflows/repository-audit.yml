name: Repository Audit

on:
  push:
    branches:
      - v7-embodied-covenant
  pull_request:
    branches:
      - main

concurrency:
  group: repository-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  line-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      npm_config_engine_strict: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Read and validate every tracked code/text file
        run: node scripts/full-repo-audit.mjs
